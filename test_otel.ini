; Test configuration for integration tests.
; Writes JSONL to test-output.jsonl (relative to working dir = publish dir).

[resource]
service.name = test-apl-service

[destination.file]
path = test-output.jsonl
rotate = none
signals = log,span,metric

[destination.console]
signals = log,span,metric

[batch]
log.size = 512
log.interval = 1000
span.size = 256
span.interval = 1000
metric.size = 256
metric.interval = 1000
