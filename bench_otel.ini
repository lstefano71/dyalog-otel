; Benchmark configuration — file destination with fast batch intervals

[resource]
service.name = bench-apl

[pipeline]
flush.timeout.ms = 20000

[destination.file]
path = bench-output.jsonl
rotate = none
signals = log,span,metric

[batch]
log.size = 1024
log.interval = 500
span.size = 1024
span.interval = 500
metric.size = 1024
metric.interval = 500
