; Text destination demo configuration.
; Used automatically by run_apl.ps1 when paired with test_text.apls.

[resource]
service.name = test-text-service
deployment.environment = development

[destination.text]
path = test-output.log
rotate = none
signals = log,metric
startup = true
promote = worker,cycle
label.worker = Worker
label.cycle = Cycle
summary.interval = 1h
summary.percentiles = 50,90,95,99
summary.metric.request_duration.name = request.duration
summary.metric.request_duration.bars = true

[batch]
log.size = 512
log.interval = 1000
span.size = 256
span.interval = 1000
metric.size = 256
metric.interval = 1000
