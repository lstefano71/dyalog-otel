; Benchmark config: OTLP/Protobuf to localhost:4318
; Run Fluent Bit first:  fluent-bit -c test_otlp_fluentbit.conf

[resource]
service.name = dyalog-otel-bench
telemetry.sdk.language = apl

[destination.otlp]
protocol = protobuf
endpoint = http://localhost:4318
signals = log,span,metric

[batch]
log.size = 1024
log.interval = 1000
span.size = 512
span.interval = 1000
metric.size = 512
metric.interval = 1000
