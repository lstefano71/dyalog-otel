[resource]
service.name = dyalog-otel-fluentbit-test
telemetry.sdk.language = apl

[pipeline]
emitter = dyalog-otel-test
emitter.version = 0.1.0

[destination.otlp]
protocol = protobuf
endpoint = http://localhost:4318
signals = log,span,metric

[batch]
log.interval = 1000
span.interval = 1000
metric.interval = 1000
